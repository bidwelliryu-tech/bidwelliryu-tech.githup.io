<script>
(function () {
    try {
        var ORDER = {
            '/': 1, '/index.html': 1,
            '/syjc.html': 2,
            '/gxrz.html': 3,
            '/about.html': 4,
            '/more.html': 5,
            '/hqzs.html': 6,
            '/play.html': 7
        };
        var cur = ORDER[location.pathname] || 0;
        var prev = parseInt(sessionStorage.getItem('hqNavFrom') || '0', 10) || 0;
        if (cur) { sessionStorage.setItem('hqNavFrom', String(cur)); }
        if (prev && cur && cur !== prev) {
            document.documentElement.classList.add(cur > prev ? 'hq-dir-fwd' : 'hq-dir-back');
        }
    } catch (e) {}
})();
</script>

<body>

  <a href="about.html" class="back-link">返回</a>

    <div class="sponsor-desc">如果这些内容对你有帮助，欢迎赞赏支持服务器运营成本。</div>
    <div class="qr-grid">

<div class="qr-viewer" id="qrViewer">
  <img id="qrViewerImg" alt="">
</div>

<script>
  (function () {
    var viewer = document.getElementById("qrViewer");
    var viewerImg = document.getElementById("qrViewerImg");
    if (!viewer || !viewerImg) return;

    function open(src, alt) {
      viewerImg.src = src;
      viewerImg.alt = alt || "";
      viewer.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function close() {
      viewer.classList.remove("open");
      document.body.style.overflow = "";
    }

    document.querySelectorAll(".qr-img").forEach(function (img) {
      img.addEventListener("click", function () { open(img.currentSrc || img.src, img.alt); });
    });

    viewer.addEventListener("click", close);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
    });
  })();
</script>
<script>
(function(){var A=["Alpha.png","APatch.png","ck.png","favicon.webp","FolkPatch.png","GitHub.png","KernelSU.png","KernelSU_Next.png","Kitsune%20Mask.png","SukiSU%20Ultra.png","toping.png","toxiang.png","wx.png","zfb.png"];var H={},P=[],R=[];document.querySelectorAll("img").forEach(function(i){var s=i.getAttribute("src"),f=i.getAttribute("data-full");if(s)H[s]=1;if(f)H[f]=1;});A.forEach(function(s){(H[s]?P:R).push(s);});function L(a){a.forEach(function(s){var i=new Image();i.decoding="async";i.src=s;});}function go(){L(P);setTimeout(function(){L(R);},120);}if(document.readyState==="complete"){go();}else{window.addEventListener("load",go);}})();
</script>
