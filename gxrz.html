<style>
    .hqNt-mask{position:fixed;inset:0;z-index:4000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(20,20,20,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
    .hqNt-mask[hidden]{display:none}
    .hqNt-glass{width:min(400px,100%);padding:24px 24px 20px;border-radius:16px;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.55);box-shadow:0 18px 50px rgba(0,0,0,.16);animation:hqNtIn .22s ease both}
    html.dark .hqNt-glass{background:rgba(29,33,39,.52);border-color:rgba(255,255,255,.09)}
    @keyframes hqNtIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
    .hqNt-mask.hqNt-close{animation:hqNtFade .2s ease both}
    .hqNt-mask.hqNt-close .hqNt-glass{animation:hqNtBye .2s ease both}
    @keyframes hqNtFade{to{opacity:0}}
    @keyframes hqNtBye{to{opacity:0;transform:scale(.97) translateY(8px)}}
    .hqNt-title{font-size:16px;font-weight:600;color:var(--black);letter-spacing:-.01em}
    .hqNt-body{margin:10px 0 14px;font-size:13.5px;line-height:1.9;color:var(--gray-1)}
    .hqNt-body strong{color:var(--accent-strong);font-size:15px}
    .hqNt-input{display:block;width:100%;height:38px;margin:10px 0 10px;padding:0 12px;border:1px solid rgba(255,255,255,.5);border-radius:8px;background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--black);font-size:14px;font-family:inherit;outline:none}
    .hqNt-input:focus{border-color:var(--accent)}
    html.dark .hqNt-input{background:rgba(29,33,39,.4);border-color:rgba(255,255,255,.09)}
    .hqNt-hint{font-size:12.5px;color:var(--gray-2);margin-bottom:10px}
    .hqNt-btn{display:block;width:100%;height:38px;border:none;border-radius:8px;background:var(--gray-5);color:var(--gray-2);font-size:13px;font-weight:600;font-family:inherit;cursor:not-allowed;transition:background .2s ease,color .2s ease}
    .hqNt-btn.ok{background:var(--accent);color:var(--white);cursor:pointer}
    .hqNt-btn.ok:hover{background:var(--accent-strong)}
</style>
<div class="hqNt-mask" id="hqNtMask">
    <div class="hqNt-glass" role="dialog" aria-modal="true">
        <div class="hqNt-title">密码提示</div>
        <div class="hqNt-body">带密码的工具，访问密码为 <strong>1026</strong>。</div>
        <input type="text" class="hqNt-input" id="hqNtInput" maxlength="20" autocomplete="off" placeholder="请输入「确认」" disabled>
        <div class="hqNt-hint" id="hqNtHint">请仔细阅读，5 秒后可输入</div>
        <button type="button" class="hqNt-btn" id="hqNtBtn">我已确认</button>
    </div>
</div>
<script>
    (function () {
        var KEY = "hq_notice_ok_gxrz_v2";
        var PASS = "确认";
        var seen = false;
        try { seen = localStorage.getItem(KEY) === "1"; } catch (e) {}
        var mask = document.getElementById("hqNtMask");
        if (seen) { mask.remove(); return; }
        document.body.style.overflow = "hidden";
        var input = document.getElementById("hqNtInput");
        input.disabled = true;
        var hint = document.getElementById("hqNtHint");
        var btn = document.getElementById("hqNtBtn");
        var ready = false;
        fetch("popup_gxrz.json")
            .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
            .then(function (d) {
                if (!d) return;
                var t = document.querySelector("#hqNtMask .hqNt-title");
                var b = document.querySelector("#hqNtMask .hqNt-body");
                if (d.title) t.textContent = d.title;
                if (d.body) b.innerHTML = d.body.replace(/1026/g, "<strong>1026</strong>");
            })
            .catch(function () {});
        var n = 5;
        hint.textContent = "请仔细阅读，" + n + " 秒后可输入";
        var t = setInterval(function () {
            n--;
            if (n > 0) {
                hint.textContent = "请仔细阅读，" + n + " 秒后可输入";
            } else {
                clearInterval(t);
                ready = true;
                input.disabled = false;
                input.focus();
                hint.textContent = "";
            }
        }, 1000);
        input.addEventListener("input", function () {
            if (input.value.trim() === PASS && ready) btn.classList.add("ok");
            else btn.classList.remove("ok");
        });
        btn.addEventListener("click", function () {
            if (!ready || input.value.trim() !== PASS) return;
            try { localStorage.setItem(KEY, "1"); } catch (e) {}
            mask.classList.add("hqNt-close");
            setTimeout(function () {
                mask.remove();
                document.body.style.overflow = "";
            }, 220);
        });
    })();
</script>

    <script>

        
        (function () {
            var nav = document.getElementById("tool-nav");
            var indicator = document.getElementById("tool-indicator");
            var links = Array.prototype.slice.call(nav.querySelectorAll(".tool-item"));
            var sections = links
                .map(function (a) { return document.getElementById("panel-" + a.dataset.tool); })
                .filter(Boolean);

            function update() {
                var line = window.innerHeight / 3;
                var current = sections[0];

                for (var i = 0; i < sections.length; i++) {
                    if (sections[i].getBoundingClientRect().top <= line) {
                        current = sections[i];
                    }
                }

                var atBottom = window.innerHeight + window.scrollY >=
                    document.documentElement.scrollHeight - 2;
                if (atBottom) {
                    current = sections[sections.length - 1];
                }

                var link = links[sections.indexOf(current)];

                links.forEach(function (l) { l.classList.remove("active"); });
                if (link) {
                    link.classList.add("active");

                    indicator.style.top = link.offsetTop + "px";
                    indicator.style.height = link.offsetHeight + "px";
                }
            }

            var ticking = false;
            function onScroll() {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(function () {
                    update();
                    ticking = false;
                });
            }

            window.addEventListener("scroll", onScroll, { passive: true });
            window.addEventListener("resize", onScroll);
            window.addEventListener("load", update);
            update();

            links.forEach(function (link) {
                link.addEventListener("click", function () {
                    var target = document.getElementById("panel-" + link.dataset.tool);
                    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
                });
            });
        })();

        
        (function () {
            var btn = document.getElementById("intro-toggle");
            var box = document.getElementById("intro-touping");
            if (!btn || !box) return;

            btn.addEventListener("click", function () {
                var collapsed = box.classList.toggle("collapsed");
                btn.textContent = collapsed ? "功能介绍" : "收起介绍";
            });
        })();

        
        (function () {
            var box = document.getElementById("more-entries");
            var btnEl = document.getElementById("toggle-touping");
            if (!box || !btnEl) return;

            btnEl.style.display = "";
            btnEl.addEventListener("click", function () {
                var collapsed = box.classList.toggle("collapsed");
                btnEl.textContent = collapsed ? "展开" : "收起";
            });
        })();

        


        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/[&<>]/g, function (m) {
                return m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;";
            });
        }

        function renderEntries(listEl, data) {
            if (!data || !data.length) return; // 接口为空时保留占位
            listEl.innerHTML = "";
            data.forEach(function (item) {
                var entry = document.createElement("div");
                entry.className = "entry";

                var changes = "";
                if (item.changes && item.changes.length) {
                    changes = '<ul class="changes">' +
                        item.changes.map(function (c) { return "<li>" + escapeHtml(c) + "</li>"; }).join("") +
                        "</ul>";
                }

                entry.innerHTML =
                    '<div class="entry-head"><span class="entry-ver">' + escapeHtml(item.version) + '</span>' +
                    '<span class="entry-date">' + escapeHtml(item.dateTime) + "</span></div>" + changes;

                listEl.appendChild(entry);
            });
        }

        function setupCollapse(listEl) {
            if (!listEl) return;
            var entries = Array.prototype.slice.call(listEl.children)
                .filter(function (c) { return c.classList && c.classList.contains("entry"); });
            if (entries.length <= 3) return;

            var oldBox = listEl.querySelector(".collapse-box");
            var oldWrap = listEl.querySelector(".toggle-wrap");
            if (oldBox) oldBox.remove();
            if (oldWrap) oldWrap.remove();

            var box = document.createElement("div");
            box.className = "collapse-box collapsed";
            var inner = document.createElement("div");
            inner.className = "collapse-inner";
            entries.slice(3).forEach(function (e) { inner.appendChild(e); });
            box.appendChild(inner);
            listEl.appendChild(box);

            var wrap = document.createElement("div");
            wrap.className = "toggle-wrap";
            var btn = document.createElement("button");
            btn.className = "btn btn-ghost btn-small";
            btn.type = "button";
            btn.textContent = "展开";
            btn.addEventListener("click", function () {
                var collapsed = box.classList.toggle("collapsed");
                btn.textContent = collapsed ? "展开" : "收起";
            });
            wrap.appendChild(btn);
            listEl.appendChild(wrap);
        }

        [
            ["onekey", "changelog.json"],
            ["touping", "touping.json"],
            ["shendun", "shendun.json"],
            ["changeid", "changeid.json"],
            ["fangfeng", "fangfeng.json"]
        ].forEach(function (pair) {
            var tid = pair[0], file = pair[1];
            var listEl = document.getElementById("list-" + tid);
            fetch(file)
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(function (data) {
                    renderEntries(listEl, data);
                    setupCollapse(listEl);
                })
                .catch(function () {
                    if (listEl) listEl.innerHTML =
                        '<div class="entry"><div class="entry-head"><span class="entry-ver">加载失败</span></div>' +
                        '<ul class="changes"><li>日志数据加载失败，请刷新重试</li></ul></div>';
                });
        });
    </script>


    <script>
        (function () {
            var shell = document.getElementById("navShell");
            function onScroll() { if (shell) shell.classList.toggle("np-hide", window.scrollY > 20); }
            window.addEventListener("scroll", onScroll, { passive: true });
            onScroll();

            var btns = [document.getElementById("theme-toggle"), document.getElementById("theme-toggle-m")];
            function toggleTheme() {
                document.documentElement.classList.toggle("dark");
                try { localStorage.setItem("theme", document.documentElement.classList.contains("dark") ? "dark" : "light"); } catch (e) {}
            }
            btns.forEach(function (b) { if (b) b.addEventListener("click", toggleTheme); });

            var menu = document.getElementById("mobileMenu");
            var burger = document.getElementById("burgerBtn");
            if (burger && menu) {
                function setMenu(open) {
                    menu.classList.toggle("open", open);
                    burger.classList.toggle("open", open);
                }
                burger.addEventListener("click", function () { setMenu(!menu.classList.contains("open")); });
                menu.querySelectorAll("a").forEach(function (a) { a.addEventListener("click", function () { setMenu(false); }); });
                document.addEventListener("click", function (e) {
                                    if (menu.classList.contains("open") && !menu.contains(e.target) && !burger.contains(e.target)) setMenu(false);
                                });
                                window.addEventListener("scroll", function () {
                                    if (menu.classList.contains("open")) setMenu(false);
                                }, { passive: true });

            }
        })();
    </script>

<div id="lightbox" class="lightbox"><img src="" alt=""></div>
<script>
    (function () {
        var lb = document.getElementById("lightbox");
        if (!lb) return;
        var img = lb.querySelector("img");
        document.addEventListener("click", function (e) {
            var t = e.target.closest ? e.target.closest(".lb-open") : null;
            if (t) {
                img.src = t.getAttribute("data-full") || t.src;
                lb.classList.add("open");
                e.preventDefault();
                return;
            }
            if (e.target === lb || e.target === img) lb.classList.remove("open");
        });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") lb.classList.remove("open"); });
    })();
</script>
