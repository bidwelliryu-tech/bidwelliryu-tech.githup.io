<div class="hqNt-mask" id="hqNtMask">
    <div class="hqNt-glass" role="dialog" aria-modal="true">
        <div class="hqNt-title">密码提示</div>

<script>
    (function () {
        var KEY = "hq_notice_ok_gxrz_v2";
        var PASS = "确认";
        var seen = false;
        try { seen = localStorage.getItem(KEY) === "1"; } catch (e) {}
        var mask = document.getElementById("hqNtMask");
        if (seen) { mask.remove(); return; }
        var hqSbw = window.innerWidth - document.documentElement.clientWidth;
        document.body.style.overflow = "hidden";
        if (hqSbw > 0) { document.body.style.paddingRight = hqSbw + "px"; }
        var input = document.getElementById("hqNtInput");
        input.disabled = true;
        var hint = document.getElementById("hqNtHint");
        var btn = document.getElementById("hqNtBtn");
        var ready = false;
        fetch("popup_gxrz.json")
            .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
            .then(function (d) {
                if (!d) return;
                var t = document.querySelector("#hqNtMask .hqNt-title");
                var b = document.querySelector("#hqNtMask .hqNt-body");
                if (d.title) t.textContent = d.title;
                if (d.body) b.innerHTML = d.body.replace(/1026/g, "<strong>1026</strong>");
            })
            .catch(function () {});
        var n = 5;
        hint.textContent = "请仔细阅读，" + n + " 秒后可输入";
        var t = setInterval(function () {
            n--;
            if (n > 0) {
                hint.textContent = "请仔细阅读，" + n + " 秒后可输入";
            } else {
                clearInterval(t);
                ready = true;
                input.disabled = false;
                input.focus();
                hint.textContent = "";
            }
        }, 1000);
        input.addEventListener("input", function () {
            if (input.value.trim() === PASS && ready) btn.classList.add("ok");
            else btn.classList.remove("ok");
        });
        btn.addEventListener("click", function () {
            if (!ready || input.value.trim() !== PASS) return;
            try { localStorage.setItem(KEY, "1"); } catch (e) {}
            mask.classList.add("hqNt-close");
            setTimeout(function () {
                mask.remove();
                document.body.style.overflow = "";
                document.body.style.paddingRight = "";
            }, 220);
        });
    })();
</script>

    <script>

        
        (function () {
            var nav = document.getElementById("tool-nav");
            var indicator = document.getElementById("tool-indicator");
            var links = Array.prototype.slice.call(nav.querySelectorAll(".tool-item"));
            var sections = links
                .map(function (a) { return document.getElementById("panel-" + a.dataset.tool); })
                .filter(Boolean);

            function update() {
                var line = window.innerHeight / 3;
                var current = sections[0];

                for (var i = 0; i < sections.length; i++) {
                    if (sections[i].getBoundingClientRect().top <= line) {
                        current = sections[i];
                    }
                }

                var atBottom = window.innerHeight + window.scrollY >=
                    document.documentElement.scrollHeight - 2;
                if (atBottom) {
                    current = sections[sections.length - 1];
                }

                var link = links[sections.indexOf(current)];

                links.forEach(function (l) { l.classList.remove("active"); });
                if (link) {
                    link.classList.add("active");

                    indicator.style.top = link.offsetTop + "px";
                    indicator.style.height = link.offsetHeight + "px";
                }
            }

            var ticking = false;
            function onScroll() {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(function () {
                    update();
                    ticking = false;
                });
            }

            window.addEventListener("scroll", onScroll, { passive: true });
            window.addEventListener("resize", onScroll);
            window.addEventListener("load", update);
            update();

            links.forEach(function (link) {
                link.addEventListener("click", function () {
                    var target = document.getElementById("panel-" + link.dataset.tool);
                    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
                });
            });
        })();

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/[&<>]/g, function (m) {
                return m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;";
            });
        }

        function renderEntries(listEl, data) {
            if (!data || !data.length) return; // 接口为空时保留占位
            listEl.innerHTML = "";
            data.forEach(function (item) {
                var entry = document.createElement("div");
                entry.className = "entry";

                var changes = "";
                if (item.changes && item.changes.length) {
                    changes = '<ul class="changes">' +
                        item.changes.map(function (c) { return "<li>" + escapeHtml(c) + "</li>"; }).join("") +
                        "</ul>";
                }

                entry.innerHTML =
                    '<div class="entry-head"><span class="entry-ver">' + escapeHtml(item.version) + '</span>' +
                    '<span class="entry-date">' + escapeHtml(item.dateTime) + "</span></div>" + changes;

                listEl.appendChild(entry);
            });
        }

        function setupCollapse(listEl) {
            if (!listEl) return;
            var entries = Array.prototype.slice.call(listEl.children)
                .filter(function (c) { return c.classList && c.classList.contains("entry"); });
            if (entries.length <= 3) return;

            var oldBox = listEl.querySelector(".collapse-box");
            var oldWrap = listEl.querySelector(".toggle-wrap");
            if (oldBox) oldBox.remove();
            if (oldWrap) oldWrap.remove();

            var box = document.createElement("div");
            box.className = "collapse-box collapsed";
            var inner = document.createElement("div");
            inner.className = "collapse-inner";
            entries.slice(3).forEach(function (e) { inner.appendChild(e); });
            box.appendChild(inner);
            listEl.appendChild(box);

            var wrap = document.createElement("div");
            wrap.className = "toggle-wrap";
            var btn = document.createElement("button");
            btn.className = "btn btn-ghost btn-small";
            btn.type = "button";
            btn.textContent = "展开";
            btn.addEventListener("click", function () {
                var collapsed = box.classList.toggle("collapsed");
                btn.textContent = collapsed ? "展开" : "收起";
            });
            wrap.appendChild(btn);
            listEl.appendChild(wrap);
        }

        [
            ["onekey", "changelog.json"],
            ["touping", "touping.json"],
            ["shendun", "shendun.json"],
            ["changeid", "changeid.json"],
            ["fangfeng", "fangfeng.json"]
        ].forEach(function (pair) {
            var tid = pair[0], file = pair[1];
            var listEl = document.getElementById("list-" + tid);
            fetch(file)
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(function (data) {
                    renderEntries(listEl, data);
                    setupCollapse(listEl);
                    if (data && data.length && data[0].version) {
                        var latestText = "最新 " + data[0].version;
                        var metaEl = document.getElementById("meta-" + tid);
                        if (metaEl) metaEl.textContent = latestText;
                        var verEl = document.getElementById("latest-" + tid);
                        if (verEl) verEl.textContent = latestText;
                    }
                })
                .catch(function () {
                    if (listEl) listEl.innerHTML =
                        '<div class="entry"><div class="entry-head"><span class="entry-ver">加载失败</span></div>' +
                        '<ul class="changes"><li>日志数据加载失败，请刷新重试</li></ul></div>';
                });
        });
    </script>
